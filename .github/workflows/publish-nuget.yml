name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.1)'
        required: false
        default: ''
      packages:
        description: 'Packages to publish (sdk, sqlserver, or both)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - sdk
          - sqlserver

env:
  DOTNET_VERSION: '10.0.x'
  PACKAGE_OUTPUT: './artifacts'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Restore dependencies
        run: dotnet restore CSharp/ILinkai.Weixin.slnx
        
      - name: Build solution
        run: dotnet build CSharp/ILinkai.Weixin.slnx --configuration Release --no-restore
        
      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Pack SDK package
        if: ${{ github.event.inputs.packages == 'both' || github.event.inputs.packages == 'sdk' || github.event_name == 'push' }}
        run: |
          dotnet pack CSharp/ILinkai.Weixin.Sdk/ILinkai.Weixin.Sdk.csproj \
            --configuration Release \
            --output ${{ env.PACKAGE_OUTPUT }} \
            --no-build \
            -p:PackageVersion=${{ steps.get_version.outputs.version }}
            
      - name: Pack SqlServer package
        if: ${{ github.event.inputs.packages == 'both' || github.event.inputs.packages == 'sqlserver' || github.event_name == 'push' }}
        run: |
          dotnet pack CSharp/ILinkai.Weixin.Sdk.SqlServer/ILinkai.Weixin.Sdk.SqlServer.csproj \
            --configuration Release \
            --output ${{ env.PACKAGE_OUTPUT }} \
            --no-build \
            -p:PackageVersion=${{ steps.get_version.outputs.version }}
            
      - name: Publish to NuGet
        run: |
          dotnet nuget push ${{ env.PACKAGE_OUTPUT }}/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
